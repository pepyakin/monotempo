# Builds and tests the monorepo with Bazel. See README.md and reth/bazel/README.md.
#
# Manual for now: a full build of reth needs ~16 cores, 32 GiB RAM and ~40 GiB
# of disk (LLVM toolchain + outputs), more than GitHub's hosted runners have.
# Point `runs-on` at a large runner and enable pull_request/push triggers once
# one is available.

name: bazel

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  bazel:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Generated files are up to date
        run: python3 reth/scripts/bazel/generate.py --check
      - name: Build
        run: bazel build --config=ci //...
      - name: Test
        run: bazel test --config=ci //...
