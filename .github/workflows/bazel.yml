# Checks the Cargo-to-Bazel metadata on every PR and push to main.
#
# Both jobs use a self-hosted Linux runner. Full builds remain opt-in and
# need ~16 cores, 32 GiB RAM and ~40 GiB of disk.
# See README.md and bazel/README.md for runner prerequisites.

name: bazel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: Build and test the full monorepo (requires a large runner)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  generated:
    name: generated files
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain pins agree
        run: python3 bazel/rust_toolchain_test.py MODULE.bazel rust-toolchain.toml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Generator tests
        run: python3 -m unittest discover -s bazel -p 'test_*.py'
      - name: Generated files are up to date
        run: python3 bazel/generate.py --check

  bazel:
    name: build and test
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    needs: generated
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build
        run: bazel build --config=ci //...
      - name: Test
        run: bazel test --config=ci //...
